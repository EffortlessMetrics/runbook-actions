# Logi Actions / Loupedeck plugin package manifest
#
# This repo is designed for the Logi Actions SDK (C#).
# See docs: https://logitech.github.io/actions-sdk-docs/

title: Runbook
version: 0.1.0
author: runbook-rs
website: https://github.com/runbook-rs

# If you want the plugin to appear even when no app is in focus, keep hasNoApplication true.
# Runbook talks to a local daemon and does not require a specific creative app.
pluginCapabilities:
  hasNoApplication: true
  usesApplicationApiOnly: true

# Optional: declare a default application profile for VS Code.
# (You can remove this if you want the user to choose.)
